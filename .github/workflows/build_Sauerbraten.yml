name: Build Sauerbraten (Windows)  
  
on:  
  push:  
    branches: [ main, master ]  
  pull_request:  
    branches: [ main, master ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: windows-2022  
  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
  
      - name: Setup MSBuild  
        uses: microsoft/setup-msbuild@v2  
  
      - name: Build Sauerbraten Release x64  
        run: msbuild Sauerbraten/vcpp/sauerbraten.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m /nologo  
  
      - name: Build Sauerbraten Release Win32  
        run: msbuild Sauerbraten/vcpp/sauerbraten.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m /nologo  
  
      - name: Find all sauerbraten.exe (diagnostic)  
        run: Get-ChildItem -Path "$env:GITHUB_WORKSPACE" -Recurse -Filter "sauerbraten.exe" | ForEach-Object { Write-Host "Found EXE: $($_.FullName) | Size: $($_.Length) bytes" }  
  
      - name: List workspace root directories (diagnostic)  
        run: Get-ChildItem -Path "$env:GITHUB_WORKSPACE" | ForEach-Object { Write-Host "$($_.FullName)" }  
  
      - name: Upload x64 artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: sauerbraten-win64  
          path: bin64/sauerbraten.exe  
  
      - name: Upload Win32 artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: sauerbraten-win32  
          path: bin/sauerbraten.exe
