name: Build Sauerbraten (Windows x64)  
  
on:  
  push:  
    branches: [ main, master ]  
  pull_request:  
    branches: [ main, master ]  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: windows-2022  
  
    steps:  
      - name: Checkout repository  
        uses: actions/checkout@v4  
  
      - name: Setup MSBuild  
        uses: microsoft/setup-msbuild@v2  
  
      - name: Build Sauerbraten Release x64  
        run: msbuild Sauerbraten/vcpp/sauerbraten.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m /nologo  
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: sauerbraten-win64  
          path: Sauerbraten/bin64/sauerbraten.exe
